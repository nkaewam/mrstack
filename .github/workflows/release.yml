name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      update_homebrew_only:
        description: Update the Homebrew formula without rebuilding or republishing the release
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: "1.24.x"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - name: Public contract
        run: go test ./internal/api ./internal/cli ./internal/contracts
      - name: Documentation contract
        run: go test -run TestDocumentationLinks ./internal/contracts
      - name: Unit and integration tests
        run: go test -shuffle=on -count=1 ./...
      - name: Race
        run: go test -race -shuffle=on -count=1 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    if: ${{ !inputs.update_homebrew_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${RELEASE_TAG#v}"
          commit="${GITHUB_SHA}"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="mrstack_${version}_${GOOS}_${GOARCH}"
          mkdir "${name}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X main.commit=${commit} -X main.buildTime=${timestamp}" \
            -o "${name}/mrstack" ./cmd/mrstack
          tar -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Generate SBOM
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            mod -json -output "mrstack_${RELEASE_TAG#v}_${{ matrix.goos }}_${{ matrix.goarch }}.sbom.json"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: mrstack_*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mrstack_*.tar.gz
            mrstack_*.tar.gz.sha256
            mrstack_*.sbom.json
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    if: ${{ !inputs.update_homebrew_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Consolidate checksums
        working-directory: dist
        run: cat mrstack_*.tar.gz.sha256 > SHA256SUMS
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" \
              dist/* \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}"
          fi

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: publish
    if: ${{ always() && (inputs.update_homebrew_only || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Require Homebrew tap token
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::Add a HOMEBREW_TAP_TOKEN repository secret with Contents write access to nkaewam/homebrew-tap."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nkaewam/homebrew-tap
          token: ${{ env.TAP_TOKEN }}
          path: tap
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --dir dist
      - name: Update and validate formula
        working-directory: source
        run: |
          go run ./cmd/update-homebrew-formula \
            -formula ../tap/Formula/mrstack.rb \
            -checksums ../dist/SHA256SUMS \
            -tag "${RELEASE_TAG}"
          ruby -c ../tap/Formula/mrstack.rb
      - name: Commit and push formula
        working-directory: tap
        run: |
          if git diff --quiet -- Formula/mrstack.rb; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mrstack.rb
          git commit -m "mrstack ${RELEASE_TAG#v}"
          git push origin HEAD:main
